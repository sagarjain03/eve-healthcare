name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eve
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://eve:eve@localhost:5432/eve
      # Dummy values, ≥ 32 bytes so the JWT library doesn't warn about a short HMAC key
      SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnop
      WEBHOOK_SECRET: ci-only-not-secret-webhook-0123456789abcdef
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
