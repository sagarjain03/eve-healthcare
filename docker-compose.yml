services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eve
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
    ports:
      - "5433:5432"  # host 5433: a native Windows Postgres already uses 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
